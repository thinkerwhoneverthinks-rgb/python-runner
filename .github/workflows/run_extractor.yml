name: Launch Extraction Runner UI

on:
  workflow_dispatch:
    inputs:
      script_to_run:
        description: "Choose interface / script to execute:"
        required: true
        default: "app.py"
        type: choice
        options:
          - app.py
          - quizard_extractor.py
          - ray-book-extract.py

jobs:
  run-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Install System Utilities (Xvfb, D-Bus, OpenVPN & Cloudflared)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 openvpn openvpn-systemd-resolved wget poppler-utils
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Select Random VPN Country
        id: pick-vpn
        run: |
          if ls .github/vpn/*.ovpn 1> /dev/null 2>&1; then
            SELECTED_CONFIG=$(ls .github/vpn/*.ovpn | shuf -n 1)
            echo "Connecting using: $SELECTED_CONFIG"
            echo "config_path=$SELECTED_CONFIG" >> "$GITHUB_OUTPUT"
            echo "has_vpn=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .ovpn files found in .github/vpn/ - Proceeding without OpenVPN"
            echo "has_vpn=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Connect to ProtonVPN
        if: steps.pick-vpn.outputs.has_vpn == 'true'
        uses: kota65535/github-openvpn-connect-action@v2
        with:
          config_file: ${{ steps.pick-vpn.outputs.config_path }}
          username: ${{ secrets.OVPN_USERNAME }}
          password: ${{ secrets.OVPN_PASSWORD }}

      - name: 🚀 Start Virtual Display & App Server
        run: |
          eval $(dbus-launch --sh-syntax)
          export DBUS_SESSION_BUS_ADDRESS
          Xvfb :99 -screen 0 1366x850x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99

          TARGET_SCRIPT="${{ inputs.script_to_run }}"
          PORT=8080

          if [ "$TARGET_SCRIPT" = "app.py" ]; then
            python app.py --port 8080 > server.log 2>&1 &
          else
            python "$TARGET_SCRIPT" > server.log 2>&1 &
          fi

          echo "Waiting for application to start on port $PORT..."
          sleep 4
          echo "✅ Server started in background."

      - name: 🌐 Launch Cloudflare Tunnel & Show Mobile Link
        id: tunnel
        run: |
          # Start cloudflared in the background and write logs to tunnel.log
          cloudflared tunnel --url http://localhost:8080 --logfile tunnel.log > /dev/null 2>&1 &

          echo "Detecting trycloudflare.com link..."
          TUNNEL_URL=""
          for i in {1..35}; do
            if [ -f tunnel.log ]; then
              TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
              if [ -n "$TUNNEL_URL" ]; then
                break
              fi
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "⚠️ Tunnel URL not detected automatically. Full tunnel log:"
            cat tunnel.log || true
            TUNNEL_URL="Could not extract URL automatically. See tunnel.log above."
          fi

          echo "PUBLIC_URL=$TUNNEL_URL" >> $GITHUB_ENV

          # Display large readable banner in logs
          echo "=========================================================="
          echo "🎉 YOUR MOBILE WEB LINK IS READY:"
          echo ""
          echo "👉  $TUNNEL_URL  👈"
          echo ""
          echo "=========================================================="

          # GitHub Action Notice: Shows prominent banner in GitHub Mobile Overview!
          echo "::notice title=📱 Mobile App Link Ready::$TUNNEL_URL"

          # GitHub Action Step Summary: Displays clickable card right on workflow run overview!
          echo "## 📱 Extraction Runner Mobile Link" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 **[$TUNNEL_URL]($TUNNEL_URL)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tap or click the link above to open Quizard Extractor & Ray Book Extractor on your phone!" >> $GITHUB_STEP_SUMMARY

      - name: ⏳ Keep Server Active (Live Session)
        run: |
          echo "=========================================================="
          echo "🚀 Session is active! Access URL: $PUBLIC_URL"
          echo "To stop the server, cancel this workflow from GitHub."
          echo "=========================================================="
          P_PID=$(pgrep -f "cloudflared tunnel" | head -n 1)
          if [ -n "$P_PID" ]; then
            wait $P_PID
          else
            sleep 21600
          fi
