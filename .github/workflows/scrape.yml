name: Quizard Scraper

on:
  workflow_dispatch:
    inputs:
      scrape_mode:
        description: 'Scrape Mode (1 for Tests, 2 for DPPs)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
      json_format:
        description: 'JSON Output Format'
        required: true
        default: 'myjson'
        type: choice
        options:
          - 'original'
          - 'myjson'
      category_name:
        description: 'Category Name (e.g., DROPPER Tests or NEET Dpps)'
        required: true
        default: 'DROPPER Tests'
      batch_name:
        description: 'Batch Name(s) separated by commas'
        required: true
        default: 'Batch Name Here'
      subject_name:
        description: 'Subject Name (ONLY REQUIRED FOR MODE 2 - DPPs)'
        required: false
        default: ''
      chapter_name:
        description: 'Chapter(s) separated by commas (ONLY REQUIRED FOR MODE 2 - DPPs)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Removed the cache line so it stops giving you that warning!

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Scraper
        env:
          SCRAPE_MODE: ${{ inputs.scrape_mode }}
          JSON_FORMAT: ${{ inputs.json_format }}
          CATEGORY_NAME: ${{ inputs.category_name }}
          BATCH_NAME: ${{ inputs.batch_name }}
          SUBJECT_NAME: ${{ inputs.subject_name }}
          CHAPTER_NAME: ${{ inputs.chapter_name }}
        run: python scraper.py

      - name: Upload Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quizard-results
          path: "*.zip"
          retention-days: 7
